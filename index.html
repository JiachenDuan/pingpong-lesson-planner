<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping Pong Lessons</title>
    <link rel="stylesheet" href="./styles.css?v=20260802-simple" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">家庭乒乓课程账本</p>
          <h1>Ping Pong Lessons</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="exportJsonBtn" title="导出备份 JSON" aria-label="导出备份 JSON">⬇</button>
          <label class="icon-button" title="导入备份 JSON" aria-label="导入备份 JSON">
            ⬆
            <input type="file" id="importJsonInput" accept="application/json" hidden />
          </label>
          <button class="icon-button danger" id="resetBtn" title="清空本机数据" aria-label="清空本机数据">×</button>
        </div>
      </header>

      <main>
        <section class="summary-band">
          <div class="month-control">
            <button class="icon-button" id="prevMonthBtn" title="上个月" aria-label="上个月">‹</button>
            <input type="month" id="monthPicker" />
            <button class="icon-button" id="nextMonthBtn" title="下个月" aria-label="下个月">›</button>
          </div>
          <div class="summary-grid summary-grid-compact">
            <div class="metric">
              <span>本月节数</span>
              <strong id="monthLessonCount">0</strong>
            </div>
            <div class="metric">
              <span>本月时长</span>
              <strong id="monthHours">0h</strong>
            </div>
            <div class="metric">
              <span>本月花费</span>
              <strong id="monthSpend">$0</strong>
            </div>
          </div>
        </section>

        <section class="settlement-panel panel">
          <div class="panel-header">
            <div>
              <h2>结算周期</h2>
              <p id="settlementRange" class="muted">首次结算</p>
            </div>
            <div class="settlement-actions">
              <button id="saveSettlementBtn" class="primary-button">保存结算日</button>
              <button id="markSettledBtn" class="secondary-button">标记已结算</button>
            </div>
          </div>
          <div class="settlement-grid">
            <label>
              上次结算日
              <input type="date" id="lastSettlementDate" />
            </label>
            <label>
              下次结算日
              <input type="date" id="nextSettlementDate" />
            </label>
            <div class="mini-metric">
              <span>周期节数</span>
              <strong id="settlementLessonCount">0</strong>
            </div>
            <div class="mini-metric">
              <span>周期时长</span>
              <strong id="settlementHours">0h</strong>
            </div>
            <div class="mini-metric">
              <span>需要结算</span>
              <strong id="settlementSpend">$0</strong>
            </div>
          </div>
        </section>

        <section class="record-section">
          <div class="panel">
            <div class="panel-header">
              <h2>记录一节课</h2>
              <button id="csvBtn" class="secondary-button">导出 CSV</button>
            </div>
            <form id="lessonForm" class="lesson-form">
              <label>
                日期
                <input type="date" id="lessonDate" required />
              </label>
              <label id="lessonChildField">
                孩子
                <select id="lessonChild" required></select>
              </label>
              <label>
                教练
                <select id="lessonCoach" required></select>
              </label>
              <label>
                分钟
                <input type="number" id="lessonMinutes" min="15" step="5" required />
              </label>
              <label class="span-2">
                备注
                <input type="text" id="lessonNote" placeholder="例如：发球、多球、比赛课" />
              </label>
              <button type="submit" class="primary-button">添加课程</button>
            </form>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>本月明细</h2>
            <div class="filters">
              <select id="childFilter"></select>
              <select id="coachFilter"></select>
            </div>
          </div>
          <div id="lessonList" class="lesson-list"></div>
        </section>
      </main>
    </div>

    <template id="emptyTemplate">
      <div class="empty-state">还没有记录。</div>
    </template>

    <script src="./app.js?v=20260802-simple"></script>
  </body>
</html>
