<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping Pong Lessons</title>
    <link rel="stylesheet" href="./styles.css?v=20260803-day-add-lesson" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">家庭乒乓课程账本</p>
          <h1>Ping Pong Lessons</h1>
        </div>
      </header>

      <main>
        <section class="quick-actions" aria-label="常用操作">
          <button id="openLessonModalBtn" class="quick-action-button primary-quick-action" type="button">
            <span>记录一节课</span>
            <b>添加今天的课程</b>
          </button>
          <button id="openSettlementModalBtn" class="quick-action-button" type="button">
            <span>结算周期</span>
            <b id="quickSettlementRange">设置结算日</b>
          </button>
        </section>

        <section class="panel calendar-panel">
          <div class="panel-header">
            <div>
              <h2 id="calendarTitleMonth">课程日历</h2>
              <p class="muted">每个日期显示当天课程和花费。</p>
            </div>
            <div class="month-control calendar-month-control">
              <input type="month" id="monthPicker" />
            </div>
          </div>
          <div class="calendar-totals">
            <div class="calendar-summary-box month-summary-box">
              <span>本月</span>
              <div class="summary-box-grid">
                <strong id="calendarMonthSpend">$0</strong>
                <b id="monthLessonCount">0 节</b>
                <b id="monthHours">0h</b>
              </div>
            </div>
            <div class="calendar-summary-box settlement-summary-box">
              <span>本次结算</span>
              <div class="summary-box-grid">
                <strong id="calendarSettlementSpend">$0</strong>
                <b id="calendarSettlementCount">0 节</b>
                <b id="calendarSettlementHours">0h</b>
              </div>
            </div>
          </div>
          <div class="calendar-weekdays">
            <span>一</span>
            <span>二</span>
            <span>三</span>
            <span>四</span>
            <span>五</span>
            <span>六</span>
            <span>日</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>

      </main>
    </div>

    <div id="lessonModal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="lessonModalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h2 id="lessonModalTitle">记录一节课</h2>
            <p class="muted">保存后会自动同步到后端。</p>
          </div>
          <button class="icon-button" id="closeLessonModalBtn" title="关闭" aria-label="关闭">×</button>
        </div>
        <form id="lessonForm" class="lesson-form modal-form">
          <label>
            日期
            <input type="date" id="lessonDate" required />
          </label>
          <label id="lessonChildField">
            孩子
            <select id="lessonChild" required></select>
          </label>
          <label>
            教练
            <select id="lessonCoach" required></select>
          </label>
          <label>
            分钟
            <input type="number" id="lessonMinutes" min="15" step="5" required />
          </label>
          <label>
            备注
            <input type="text" id="lessonNote" placeholder="例如：发球、多球、比赛课" />
          </label>
          <div class="modal-actions">
            <button type="submit" class="primary-button">添加课程</button>
            <button id="csvBtn" class="secondary-button" type="button">导出 CSV</button>
          </div>
        </form>
      </div>
    </div>

    <div id="settlementModal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="settlementModalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h2 id="settlementModalTitle">结算周期</h2>
            <p id="settlementRange" class="muted">首次结算</p>
          </div>
          <button class="icon-button" id="closeSettlementModalBtn" title="关闭" aria-label="关闭">×</button>
        </div>
        <div class="settlement-grid modal-settlement-grid">
          <label>
            上次结算日
            <input type="date" id="lastSettlementDate" />
          </label>
          <label>
            下次结算日
            <input type="date" id="nextSettlementDate" />
          </label>
          <div class="mini-metric">
            <span>周期节数</span>
            <strong id="settlementLessonCount">0</strong>
          </div>
          <div class="mini-metric">
            <span>周期时长</span>
            <strong id="settlementHours">0h</strong>
          </div>
          <div class="mini-metric">
            <span>需要结算</span>
            <strong id="settlementSpend">$0</strong>
          </div>
        </div>
        <div class="modal-actions settlement-modal-actions">
          <button id="saveSettlementBtn" class="primary-button" type="button">保存结算日</button>
          <button id="markSettledBtn" class="secondary-button" type="button">标记已结算</button>
        </div>
      </div>
    </div>

    <div id="dayModal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h2 id="dayModalTitle">课程详情</h2>
            <p id="dayModalSummary" class="muted"></p>
          </div>
          <button class="icon-button" id="closeDayModalBtn" title="关闭" aria-label="关闭">×</button>
        </div>
        <div id="dayModalLessons" class="modal-lessons"></div>
        <div class="modal-actions day-modal-actions">
          <button id="addLessonFromDayBtn" class="primary-button" type="button">添加课程</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>

      };
    </script>
    <script src="./app.js?v=20260803-day-add-lesson"></script>
  </body>
</html>
